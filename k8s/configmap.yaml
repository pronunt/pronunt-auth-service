apiVersion: v1
kind: ConfigMap
metadata:
  name: pronunt-auth-service-config
  namespace: prism
data:
  APP_NAME: pronunt-auth-service
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  LOG_LEVEL: INFO
  GITHUB_APP_ID: replace-me
  GITHUB_INSTALLATION_ID: replace-me
  GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem

